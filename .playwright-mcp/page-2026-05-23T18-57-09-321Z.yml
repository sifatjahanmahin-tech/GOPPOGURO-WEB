    - generic [ref=e35]:
      - generic [ref=e36]:
        - generic [ref=e37]: The Makers Behind Every Joy
        - heading "Made by Hands, Shared by Hearts" [level=1] [ref=e38]:
          - text: Made by Hands,
          - text: Shared by Hearts
        - paragraph [ref=e39]: The Women Makers Programme is a community-centred initiative where women artisans transform simple paper into handcrafted Little Joys — earning flexible, dignified income while their creativity funds a child's education.
        - paragraph [ref=e40]: Each Little Joy is more than a folded paper object. It is a moment of care, patience, and human connection — made by hands that matter.
        - generic [ref=e41]:
          - link "See Little Joys" [ref=e42] [cursor=pointer]:
            - /url: little-joys.html
          - link "Partner with Us" [ref=e43] [cursor=pointer]:
            - /url: contact.html?subject=Artisan%20Partnership
      - generic [ref=e44]:
        - img "Woman artisan folding paper with care" [ref=e45]
        - img "Handcrafted Little Joys origami pieces" [ref=e46]
    - generic [ref=e49]:
      - generic [ref=e50]:
        - generic [ref=e51]: 100% Handmade
        - heading "Every Fold Tells a Story" [level=2] [ref=e52]
        - paragraph [ref=e53]: No machines. No factories. Only time, patience, creativity, and human care. Watch as paper transforms through the hands of our makers into something small, beautiful, and full of meaning.
        - paragraph [ref=e54]: Hearts. Stars. Birds. Flowers. Butterflies. Boats. Each fold carries intention — and when a Little Joy reaches you, it carries the story of the woman who made it.
        - paragraph [ref=e55]: "\"Because every fold carries a story.\""
      - paragraph [ref=e60]: Handcrafted, one fold at a time
    - generic [ref=e63]:
      - img "Women artisans working together in community" [ref=e65]
      - generic [ref=e66]:
        - generic [ref=e67]: Why This Exists
        - heading "The Woman Behind the Fold" [level=2] [ref=e68]
        - paragraph [ref=e69]: Many women possess extraordinary creativity, patience, and making skills — but often have limited access to flexible income opportunities that fit around their daily lives and responsibilities.
        - paragraph [ref=e70]: The Women Makers Programme creates an accessible and dignified form of creative work where women participate from their own communities, developing craftsmanship, confidence, and financial independence — on their own terms.
        - blockquote [ref=e71]:
          - paragraph [ref=e72]: "\"We believe meaningful work does not always require factories, machines, or complicated systems. Sometimes, change begins with hands, patience, and care.\""
