  - main [ref=e32]:
    - generic [ref=e34]:
      - generic [ref=e35]: — Why We Exist
      - heading "About Goppo Guro" [level=1] [ref=e36]
      - paragraph [ref=e37]: A creative learning initiative dedicated to making space for play, paper, and pause in a world that moves too fast.
    - generic [ref=e40]:
      - generic [ref=e41]:
        - heading "Our Vision" [level=2] [ref=e42]
        - paragraph [ref=e43]: To create a world where curiosity is nurtured, creativity is a fundamental right, and every individual has the space to pause and reconnect with themselves and others through the magic of stories and simple paper experiences.
      - generic [ref=e44]:
        - heading "Our Mission" [level=2] [ref=e45]
        - paragraph [ref=e46]: Our mission is to foster a creative ecosystem in Bangladesh and beyond by designing handcrafted learning tools, building community networks, and providing platforms for imaginative discovery for all ages.
    - generic [ref=e49]:
      - img "Salman Oshan, Founder of Goppo Guro" [ref=e51]
      - generic [ref=e52]:
        - generic [ref=e53]: — The Inspiration
        - heading "Born from a Quiet Concern" [level=2] [ref=e54]
        - paragraph [ref=e55]: Goppo Guro was created from a quiet concern — that we are losing our relationship with play, with paper, and with pause. In a world driven by speed, screens, and outcomes, we wanted to create space for something more human.
        - paragraph [ref=e56]: At the heart of Goppo Guro is story. Our name "গপ্পো গুঁড়ো" means small stories — sparks of stories. Gentle beginnings that invite curiosity and connection. Goppo Guro is not only for children. It is for anyone who believes that stories, play, and pause are essential to being human.
        - blockquote [ref=e57]:
          - paragraph [ref=e58]: "\"There are no right answers here, no timers, no expectations — only moments of presence, imagination, and shared discovery.\""
          - generic [ref=e59]: — Salman Oshan, Founder
    - generic [ref=e62]:
      - generic [ref=e63]:
        - generic [ref=e64]: — Our Community
        - heading "A Small but Loud Bunch" [level=2] [ref=e65]
        - paragraph [ref=e66]: GoppoGuro was built by people who believe that a folded piece of paper can change the energy in a room. Our team is a mix of storytellers, designers, educators, and dreamers.
        - paragraph [ref=e67]: We work closely with women artisans, schools, and children who remind us why none of this needs to be complicated.
      - img "The Goppo Guro Team" [ref=e69]
    - generic [ref=e71]:
