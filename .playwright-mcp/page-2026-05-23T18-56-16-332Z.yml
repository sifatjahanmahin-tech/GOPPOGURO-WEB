        - generic [ref=e64]: About Us
        - heading "What is Goppoguro?" [level=2] [ref=e65]
        - paragraph [ref=e66]: Goppoguro is a creative learning initiative designed to nurture curiosity and foster human connection. We believe that small stories (গপ্পো) and gentle beginnings (গুঁড়ো) can spark lifelong journeys of discovery.
        - paragraph [ref=e67]: Through handcrafted paper experiences and storytelling, we create a space where imagination knows no bounds. Our mission is to bring play, paper, and pause back into our high-speed lives.
