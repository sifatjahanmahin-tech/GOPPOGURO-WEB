      - article [ref=e159]:
        - generic [ref=e160]: Our Story
        - heading "Born from a Quiet Concern" [level=2] [ref=e161]
        - paragraph [ref=e162]: Goppo Guro was created from a quiet concern — that we are losing our relationship with play, with paper, and with pause. In a world driven by speed, screens, and outcomes, we wanted to create space for something more human.
        - paragraph [ref=e163]: At the heart of Goppo Guro is story. Our name "গপ্পো গুঁড়ো" means small stories, or sparks of stories — gentle beginnings that invite curiosity and connection. Stories have shaped our world, and they continue to shape us through imagination and memory.
        - paragraph [ref=e164]: Goppo Guro is not only for children. It is for anyone who believes that stories, play, and pause are essential to being human. We design books, stories, and simple paper experiences that allow these small stories to unfold through play.
        - blockquote [ref=e165]: "\"There are no right answers here, no timers, no expectations — only moments of presence, imagination, and shared discovery.\""
        - link "Read Our Full Story" [ref=e166] [cursor=pointer]:
          - /url: about.html
          - text: Read Our Full Story
          - img [ref=e167]
