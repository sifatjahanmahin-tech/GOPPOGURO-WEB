    - generic "Our origin story" [ref=e48]:
      - region "Beat 01 — It started with paper" [ref=e49]:
        - generic [ref=e50]:
          - generic [ref=e51]: 01 — Origin
          - separator [ref=e52]
          - heading "It Started With Paper" [level=2] [ref=e53]:
            - text: It Started
            - text: With Paper
          - separator [ref=e54]
          - paragraph [ref=e55]: A single piece of paper. Folded once. Then again. The act of folding is where Goppo Guro began — not in an office, not with a plan, but with a quiet belief that something beautiful was possible.
      - region "Beat 02 — A studio was born" [ref=e56]:
        - generic [ref=e57]:
          - generic [ref=e58]: 02 — Studio
          - separator [ref=e59]
          - heading "A Studio Was Born" [level=2] [ref=e60]:
            - text: A Studio
            - text: Was Born
          - separator [ref=e61]
          - paragraph [ref=e62]: From a home corner, the Goppoguro Studio Network grew. What began as one creative space became a living network — bringing workshops, tools, and the permission to make into communities that needed it.
      - region "Beat 03 — Stories needed telling" [ref=e63]:
        - generic [ref=e64]:
          - generic [ref=e65]: 03 — Stories
          - separator [ref=e66]
          - heading "Stories Needed Telling" [level=2] [ref=e67]:
            - text: Stories
            - text: Needed
            - text: Telling
          - separator [ref=e68]
          - paragraph [ref=e69]: Children were creating. Drawing. Imagining. But their stories had nowhere to go. Golpoka Club changed that — giving every curious child a box full of materials and a community to share with.
      - region "Beat 04 — Hands found purpose" [ref=e70]:
        - generic [ref=e71]:
          - generic [ref=e72]: 04 — Craft
          - separator [ref=e73]
          - heading "Hands Found Purpose" [level=2] [ref=e74]:
            - text: Hands
            - text: Found
            - text: Purpose
          - separator [ref=e75]
          - paragraph [ref=e76]: Women in the community picked up paper. And found not just a craft — but a livelihood. Every fold became income. Every jar became a child's education day. Little Joys was born.
      - region "Beat 05 — Still beginning" [ref=e77]:
        - generic [ref=e78]:
          - generic [ref=e79]: 05 — Now
          - separator [ref=e80]
          - heading "And We're Still Beginning" [level=2] [ref=e81]:
            - text: And We're
            - text: Still
            - text: Beginning
          - separator [ref=e82]
          - paragraph [ref=e83]: The paper keeps folding. New projects are forming. The question was never "how much?" — it was always "what's next?" Every project you see here is an answer to that question.
