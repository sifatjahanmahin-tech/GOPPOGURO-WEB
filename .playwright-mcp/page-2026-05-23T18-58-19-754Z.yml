      - generic [ref=e35]: What We Build
      - heading "Every Project. One Purpose." [level=1] [ref=e36]:
        - text: Every Project.
        - text: One Purpose.
      - paragraph [ref=e37]: "From origami jars to adventure books to studio networks — each project is a new way to ask the same question: how can we make creativity more accessible in Bangladesh?"
