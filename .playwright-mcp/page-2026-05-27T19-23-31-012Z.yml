        - heading "Creative Learning Programme" [level=2] [ref=e51]
        - paragraph [ref=e52]: The Goppoguro Creative Learning Programme (GCLP) brings weekly paper-based workshops into schools — turning classrooms into spaces of storytelling, creative making, and joyful expression. Children don't just learn about creativity; they live it.
        - paragraph [ref=e53]: Built on the 4P Framework — Projects, Passion, Peers, Play — GCLP equips educators and children with the tools, materials, and confidence to explore their inner worlds through paper. Each session ends with a creative exhibition where children celebrate what they have made.
