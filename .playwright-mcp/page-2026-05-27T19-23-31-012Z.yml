        - heading "Women Makers" [level=2] [ref=e76]
        - paragraph [ref=e77]: The Women Makers Programme is the heartbeat behind Little Joys. Women artisans across communities fold tiny paper objects by hand — hearts, stars, birds, butterflies — earning flexible, fair income from their homes while building craftsmanship and quiet confidence.
        - paragraph [ref=e78]: Every fold is an act of care. Every purchase funds both the maker's livelihood and a child's education. No factories. No machines. Only time, patience, and human hands.
        - blockquote [ref=e79]:
          - paragraph [ref=e80]: "\"Small folds. Meaningful work. Quiet empowerment.\""
